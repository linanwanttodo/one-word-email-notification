name: Daily Yiyan

on:
  schedule:
    # 每天 UTC 0 点运行一次（对应北京时间上午 8 点）
    # 如需北京时间每天 9 点运行，改为：0 1 * * * （UTC 1 点 = 北京 9 点）
    - cron: '0 0 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  daily-yiyan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run main script
        env:
          NOTIFY_TYPE: ${{ secrets.NOTIFY_TYPE }}
          YIYAN_API_ID: ${{ secrets.YIYAN_API_ID }}
          YIYAN_API_KEY: ${{ secrets.YIYAN_API_KEY }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python main.py

  # 防止 GitHub 因仓库 60 天无提交而自动停用定时任务（disabled_inactivity）
  # 原理：当距最后一次提交超过 50 天时，自动创建一个空提交，重置不活跃计时器
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Keep repo alive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          LAST_COMMIT=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DAYS=$(( (NOW - LAST_COMMIT) / 86400 ))
          echo "距上次提交已 ${DAYS} 天"
          if [ "$DAYS" -ge 50 ]; then
            git commit --allow-empty -m "chore: keepalive [skip ci]"
            git push
            echo "已创建 keepalive 空提交，重置 60 天不活跃计时器"
          else
            echo "仓库仍然活跃，无需 keepalive"
          fi
